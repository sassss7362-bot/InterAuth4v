# ============================================================
#  InterAuth — настройки
#  Цвета: &a &e &c &6 &f и т.д. Переменные: %time% %left% %n% %max% %min%
# ============================================================

# Время на регистрацию (секунды) — таймер вверху экрана
register-timeout: 45
# Время на авторизацию (секунды) — таймер вверху экрана
login-timeout: 45
# Как часто (секунды) напоминать на экране и в чате про /reg или /l
reminder-interval: 5
# Сколько часов после входа по паролю игрок заходит БЕЗ ввода /l (72 = 3 дня)
session-hours: 72
# Привязывать сессию к IP (если IP сменился — потребуется /l)
check-ip: true
# Минимальная длина пароля
min-password-length: 6
# Максимум неверных паролей до кика
max-attempts: 5

messages:
  # --- Таймер вверху (боссбар) ---
  bar-register: "&e&lРЕГИСТРАЦИЯ &7— осталось &f%time% сек"
  bar-login: "&e&lАВТОРИЗАЦИЯ &7— осталось &f%time% сек"

  # --- Надпись на экране (каждые reminder-interval секунд) ---
  title-register: "&6&lРегистрация"
  subtitle-register: "&eВведите: &f/reg <пароль> <пароль>"
  title-login: "&6&lАвторизация"
  subtitle-login: "&eВведите: &f/l <пароль>"

  # --- Сообщения в чат (каждые reminder-interval секунд) ---
  chat-register: "&e⚠ Зарегистрируйтесь: &f/reg <пароль> <пароль>"
  chat-login: "&e⚠ Авторизуйтесь: &f/l <пароль>"

  # --- Кик ---
  kick-register: "&cВремя на регистрацию вышло."
  kick-login: "&cВремя на авторизацию вышло."
  kick-attempts: "&cСлишком много неверных попыток ввода пароля."

  # --- Успех ---
  session-restored: "&aВы автоматически авторизованы. Пароль потребуется снова через &f%left%&a."
  register-ok: "&aРегистрация прошла успешно! Вы вошли на сервер."
  login-ok: "&aВы успешно авторизовались!"
  password-changed: "&aПароль успешно изменён."

  # --- Ошибки ---
  only-players: "Эта команда доступна только игрокам."
  no-permission: "&cУ вас нет прав."
  already-registered: "&cВы уже зарегистрированы. Используйте &f/l <пароль>&c."
  already-logged: "&cВы уже авторизованы."
  not-registered: "&cСначала зарегистрируйтесь: &f/reg <пароль> <пароль>"
  need-login: "&cСначала авторизуйтесь."
  usage-reg: "&cИспользование: &f/reg <пароль> <пароль>"
  usage-login: "&cИспользование: &f/l <пароль>"
  usage-cp: "&cИспользование: &f/cp <старый пароль> <новый пароль>"
  passwords-mismatch: "&cПароли не совпадают."
  password-short: "&cПароль должен быть не короче &f%min% &cсимволов."
  wrong-password: "&cНеверный пароль (&f%n%&c/&f%max%&c)."
  wrong-old-password: "&cСтарый пароль неверен."
  error: "&cПроизошла ошибка. Попробуйте ещё раз."

  # --- Админ-команды ---
  usage-authset: "&cИспользование: &f/authset <reg|login> [clear]"
  loc-reg-set: "&aТочка РЕГИСТРАЦИИ сохранена."
  loc-login-set: "&aТочка АВТОРИЗАЦИИ сохранена."
  loc-reg-cleared: "&eТочка регистрации удалена — новички остаются на месте."
  loc-login-cleared: "&eТочка авторизации удалена — игроки остаются на месте."
  usage-authreset: "&cИспользование: &f/authreset <ник>"
  reset-ok: "&aАккаунт игрока &f%player% &aсброшен. Он сможет зарегистрироваться заново."
  reset-none: "&cАккаунт игрока &f%player% &cне найден."
  reloaded: "&aНастройки InterAuth перезагружены."
